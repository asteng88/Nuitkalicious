[project]
name = "nuitkalicious"
version = "1.5.0"
description = "A modern GUI front-end for the Nuitka Python compiler with uv integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nuitka>=4.0.8",
    "ordered-set>=4.1.0",
    "zstandard>=0.23.0",
    "imageio>=2.36.0",
    "psutil>=6.1.0",
]

[project.scripts]
nuitkalicious = "nuitkalicious:main"

[project.gui-scripts]
nuitkalicious-gui = "nuitkalicious:main"
